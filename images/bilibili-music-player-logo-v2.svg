<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Bilibili Music Player logo, version 2</title>
  <desc id="desc">A square pink app icon with a white screen and play mark, plus a white audio equalizer.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff82a6"/>
      <stop offset="1" stop-color="#f05284"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>

  <!-- Abstract TV silhouette -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M405 279 331 205M619 279l74-74" stroke-width="32"/>
    <rect x="214" y="285" width="596" height="470" rx="96" stroke-width="42"/>
  </g>

  <!-- Video play mark, shifted left to keep a clear gap from the equalizer -->
  <path d="M380 412c0-18 20-29 36-20l177 103c16 9 16 32 0 41L416 639c-16 9-36-2-36-20V412Z" transform="translate(-34 0)" fill="#fff"/>

  <!-- Audio equalizer, kept white for one coherent mark -->
  <g fill="#fff">
    <rect x="612" y="474" width="30" height="112" rx="15"/>
    <rect x="661" y="438" width="30" height="184" rx="15"/>
    <rect x="710" y="492" width="30" height="76" rx="15"/>
  </g>
</svg>